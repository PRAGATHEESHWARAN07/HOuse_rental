<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Owner Dashboard - Add House</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#f2f2f2;
    color:#333;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#ededed;
    padding:25px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

header i {
    font-size: 46px;
    color: #777;
}

header h1{
    font-size:26px;
    color:#444;
}

header p{
    font-size:18px;
    color:#444;
}

/* MIDDLE WRAPPER */
.wrapper{
    flex:1;
    display:flex;
}

/* SIDE NAV */
.sidenav{
    width:240px;
    background:#e0e0e0;
    padding-top:20px;
    box-shadow:2px 0 10px rgba(0,0,0,0.1);
}

.sidenav h3{
    text-align:center;
    margin-bottom:25px;
    color:#555;
}

.sidenav a{
    display:block;
    padding:15px 25px;
    text-decoration:none;
    color:#444;
    font-size:16px;
}

.sidenav a i{
    margin-right:10px;
    color:#666;
}

.sidenav a:hover{
    background:#d0d0d0;
}

/* CONTENT */
.content{
    flex:1;
    padding:30px;
}

/* FORM STYLING WITH ICONS */
form {
    background:#e8e8e8;
    padding:25px;
    border-radius:12px;
    max-width:600px;
    margin:0 auto;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* Input group for icons */
.input-group {
    position: relative;
    margin-bottom: 15px;
}

.input-group i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #ff6b6b; /* light red */
    font-size: 18px;
}

.input-group input {
    width: 100%;
    padding: 10px 12px 10px 35px; /* left padding for icon */
    border:1px solid #ccc;
    border-radius:8px;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#888;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
    outline:none;
}

.input-group input[type="file"] {
    padding-left:12px;
}

/* BUTTON */
form button{
    background:#dcdcdc;
    color:#333;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

form button:hover{
    background:#c0c0c0;
}

/* FOOTER */
footer{
    background:#dcdcdc;
    text-align:center;
    padding:15px;
    font-size:14px;
    color:#555;
}
</style>
</head>

<body>

<header>
    <i class="fa-solid fa-building"></i>
    <h1>Owner Dashboard</h1>
    <p>Manage Your Houses and Bookings Efficiently</p>
</header>

<div class="wrapper">

    <!-- SIDE NAV -->
    <div class="sidenav">
        <h3><i class="fa-solid fa-user-tie"></i> Owner Panel</h3>
        <a href="/owner/dashboard">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="/owner/add-house"><i class="fa-solid fa-plus"></i> Add House</a>
        <a href="/owner/view-houses"><i class="fa-solid fa-eye"></i> View Houses</a>
        <a href="/owner/contact-responses"><i class="fa-solid fa-envelope"></i> Contact Responses</a>
        <a href="/owner/booking-responses"><i class="fa-solid fa-calendar-check"></i> Booking Responses</a>
        <a href="/owner/payments"><i class="fa-solid fa-credit-card"></i> Payments</a>
        <a href="/owner/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <h2>Add House</h2>

        <form method="post" enctype="multipart/form-data">

            <div class="input-group">
                <i class="fa-solid fa-door-closed"></i>
                <input type="text" name="flat_number" placeholder="Flat Number" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-tag"></i>
                <input type="text" name="flat_name" placeholder="Flat Name" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-city"></i>
                <input type="text" name="area_name" placeholder="Area Name" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" name="location" placeholder="Location" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-map-pin"></i>
                <input type="text" name="pincode" placeholder="Pincode" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-money-bill-wave"></i>
                <input type="text" name="rent_per_month" placeholder="Rent / Month" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-hand-holding-dollar"></i>
                <input type="text" name="advance" placeholder="Advance" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-house"></i>
                <input type="number" name="no_of_rooms" placeholder="No of Rooms" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-bed"></i>
                <input type="number" name="no_of_bedrooms" placeholder="No of Bedrooms" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-image"></i>
                <input type="file" name="image1" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-image"></i>
                <input type="file" name="image2">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-image"></i>
                <input type="file" name="image3">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-image"></i>
                <input type="file" name="image4">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-image"></i>
                <input type="file" name="image5">
            </div>

            <button type="submit"><i class="fa-solid fa-plus"></i> Add House</button>
        </form>

    </div>

</div>

<footer>
    <i class="fa-solid fa-building"></i>
    © 2026 House & Flat Rental Portal
</footer>

</body>
</html>
