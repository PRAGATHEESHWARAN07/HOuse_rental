<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Owner Register</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    background: #f2f2f2;
    font-family: "Segoe UI", sans-serif;
    color: #333;
    padding: 30px;
}

h2 {
    color: #444;
    margin-bottom: 20px;
    text-align: center;
}

.login-form {
    background: #e8e8e8;
    padding: 30px;
    border-radius: 12px;
    max-width: 400px;
    margin: 0 auto;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    animation: floatForm 4s ease-in-out infinite;
}

/* Input wrapper for icons */
.input-group {
    position: relative;
    margin-bottom: 20px;
}

.input-group i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #e57373; /* light red icons */
    font-size: 18px;
}

.input-group input {
    width: 100%;
    padding: 10px 12px 10px 35px; /* padding-left for icon */
    border: 1px solid #ccc;
    border-radius: 8px;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #888;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
    outline: none;
}

/* Buttons */
.btn {
    background: #dcdcdc;
    color: #333;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    margin-right: 10px;
}

.btn:hover {
    background: #c0c0c0;
}

.back-btn {
    display: inline-block;
    background: #f0f0f0;
    color: #333;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 15px;
    transition: 0.3s;
}

.back-btn i {
    margin-right: 5px;
}

.back-btn:hover {
    background: #dcdcdc;
}

/* Paragraph links */
p {
    text-align: center;
    margin-top: 15px;
}

p a {
    color: #444;
    text-decoration: none;
    font-weight: 500;
}

p a:hover {
    color: #000;
}

/* Floating animation */
@keyframes floatForm {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<h2>Owner Register</h2>

<form method="post" class="login-form">

    <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="name" placeholder="Name" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" name="email" placeholder="Email" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="text" name="mobile" placeholder="Mobile" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Password" required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-location-dot"></i>
        <input type="text" name="location" placeholder="Location" required>
    </div>

    <button type="submit" class="btn">Register</button>
    <a href="http://127.0.0.1:5000/" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>

</form>

<br>

<p>
    Already have an account?
    <a href="/owner/login">Sign in</a>
</p>

</body>
</html>
